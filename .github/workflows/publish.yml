name: Publish to npm

# Two ways to publish:
#
#   1. Push a tag matching `v*` (e.g. `v1.0.2`) on a commit on `main` →
#      publishes to npm. The `verify` job refuses the release unless the
#      tag is exactly `v` + the `package.json` version and the tagged commit
#      is on `main`.
#
#   2. Manual `workflow_dispatch`:
#      - `target=test` publishes the dispatched commit under the `next`
#        dist-tag, for a dry-run install before a structural change ships.
#        npm never reuses a number, so `verify` requires a pre-release
#        version in `package.json` (`1.4.0-rc.1`).
#      - `target=prod` publishes the dispatched commit to `latest`; `verify`
#        requires that commit to be on `main`.
#      - `target=stage-proof` stages a throwaway prerelease (RELEASING.md).
#
# Auth is OIDC trusted publishing behind a human approval (converted
# 2026-07-13): npm trusts this repo + publish.yml + the npm-publish
# environment; the environment's required reviewer approves every release
# with one tap; provenance is attached automatically. No npm tokens exist
# anywhere — npm's hardening EOTPs every token type on 2FA-enforced
# accounts (evidence in agentchat-mcp's conversion commit).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        required: true
        default: test
        options: [test, prod, stage-proof]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse a release that would publish something other than what the tag
  # says, or a commit that never reached main. Runs before anything else.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches the package version; the commit is on main
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          if ! version="$(jq -er '.version | select(type == "string" and length > 0)' package.json)"; then
            echo "::error::could not read the version from package.json"
            exit 1
          fi
          problems=0
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version (expected v$version)"
            problems=1
          fi
          # Build metadata (`+…`) is not part of the number npm keeps.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TARGET" = "test" ] && [[ "${version%%+*}" != *-* ]]; then
            echo "::error::target=test publishes $version under the next dist-tag, and npm never reuses a number; set a pre-release version (like 1.4.0-rc.1) first"
            problems=1
          fi
          if [ "$EVENT" = "push" ] || [ "$TARGET" = "prod" ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_SHA is not on main; releases are cut from main only"
              problems=1
            fi
          fi
          exit "$problems"

  # Re-run the full test suite on the tagged commit. Don't trust prior
  # CI status — someone could tag a feature branch directly and skip the
  # main-branch sweep.
  test:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run build

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment: npm-publish # human approval gate — one tap per release
    permissions:
      id-token: write # OIDC exchange with npm (trusted publishing)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest # OIDC exchange needs a current npm CLI
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Use `npm publish` rather than `pnpm publish` — pnpm's publish HTTP
      # PUT has a long-standing tendency to drop auth headers in CI, while
      # npm publish natively performs the OIDC trusted-publishing exchange.
      - name: Publish (next dist-tag for dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'test' }}
        run: npm publish --access public --tag next

      - name: Publish (prod)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod') }}
        run: npm publish --access public

      - name: Stage-proof (never public — reject the stage on npmjs.com after)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'stage-proof' }}
        run: |
          npm version "$(node -p "require('./package.json').version")-proof.${{ github.run_number }}" --no-git-tag-version
          npm stage publish --access public --tag proof

  # ─── Slack notifications (routing contract: core repo infra/monitoring/README.md) ───
  # awaiting-tap: fires after build succeeds, while the environment-gated
  # publish job sits waiting for the human approval — so the tap request
  # lives in Slack, not email. failure: any red job in the pipeline.
  # Both fail-safe: absent secret → logged warning, exit 0. A post Slack
  # refuses (a revoked webhook) or never answers fails its step, so the run
  # shows it; continue-on-error keeps that from failing the release.
  notify-awaiting-tap:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod')
    steps:
      - name: Post to Slack
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WARNING }}
          TEXT: ":hourglass_flowing_sand: *agentchatme (npm) release awaiting your approval* (`${{ github.ref_name }}` → npm-publish gate). Tap it here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::SLACK_WEBHOOK_WARNING not set — skipped"; exit 0; fi
          if ! printf '%s' "$TEXT" | jq -Rs '{text: .}' | curl -fsS -o /dev/null --max-time 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK"; then
            echo "::error::the Slack post failed (webhook revoked, or Slack unreachable)"
            exit 1
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: [verify, test, publish]
    if: failure()
    steps:
      - name: Post to Slack
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WARNING }}
          TEXT: ":warning: *agentchatme (npm) publish pipeline failed* on `${{ github.ref_name }}` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::SLACK_WEBHOOK_WARNING not set — skipped"; exit 0; fi
          if ! printf '%s' "$TEXT" | jq -Rs '{text: .}' | curl -fsS -o /dev/null --max-time 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK"; then
            echo "::error::the Slack post failed (webhook revoked, or Slack unreachable)"
            exit 1
          fi
