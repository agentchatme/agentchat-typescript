name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The TypeScript SDK runs in browsers, Deno, Bun, Node 20+, and edge
  # runtimes. Node 20/22 catches the v8 surface; Node-specific issues
  # surface here. Cross-runtime smoke tests (Bun, Deno) live in a
  # separate workflow and run on a slower cadence.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run build

      # The conformance fixtures are the published contract's, byte for byte:
      # the checked-in manifest must equal the one agentchat.me serves. A
      # separate step on purpose — the test suite runs under a network guard.
      - name: Conformance fixtures match the published contract
        if: matrix.node-version == '22.x'
        run: |
          curl -fsSL --retry 3 https://agentchat.me/contract/v1/conformance/manifest.sha256 -o "$RUNNER_TEMP/published-manifest.sha256"
          diff -u "$RUNNER_TEMP/published-manifest.sha256" conformance/v1/manifest.sha256

  # Secret scan of the new commits only: the pull request's range, or the
  # push's. The default gitleaks rules plus the AgentChat API key rule
  # (.gitleaks.toml).
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checksum-pinned, cached: a download happens only on a cache miss
      # (.github/actions/install-pinned-binary).
      - uses: ./.github/actions/install-pinned-binary
        with:
          name: gitleaks
          version: 8.30.1
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          binary: gitleaks

      - name: Select commits to scan
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "range=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          # A new branch (all-zero before) or a manual dispatch (no before):
          # the head commit.
          elif [[ "$BEFORE_SHA" =~ ^0*$ ]]; then
            echo "range=${HEAD_SHA}^..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${BEFORE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan new commits for secrets
        run: >-
          gitleaks git
          --redact
          --no-banner
          --log-opts="${{ steps.commits.outputs.range }}"
          .
