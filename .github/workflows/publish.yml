name: Publish to npm

# Two ways to publish:
#
#   1. Push a tag matching `v*` (e.g. `v1.0.2`) → publishes to npm.
#      The version in `package.json` is the source of truth; the workflow
#      does not parse the tag.
#
#   2. Manual `workflow_dispatch` with `target=test` → publishes a `next`
#      dist-tag for dry-run install verification. Use this before the first
#      real release after a structural change.
#
# Auth is OIDC trusted publishing behind a human approval (converted
# 2026-07-13): npm trusts this repo + publish.yml + the npm-publish
# environment; sanim's one-tap approval gates every release; provenance
# is attached automatically. No npm tokens exist anywhere — npm's
# hardening EOTPs every token type on 2FA-enforced accounts (evidence
# in agentchat-mcp's conversion commit).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        required: true
        default: test
        options: [test, prod, stage-proof]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the full test suite on the tagged commit. Don't trust prior
  # CI status — someone could tag a feature branch directly and skip the
  # main-branch sweep.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run build

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment: npm-publish # human approval gate — one tap per release
    permissions:
      id-token: write # OIDC exchange with npm (trusted publishing)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest # OIDC exchange needs a current npm CLI
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Use `npm publish` rather than `pnpm publish` — pnpm's publish HTTP
      # PUT has a long-standing tendency to drop auth headers in CI, while
      # npm publish natively performs the OIDC trusted-publishing exchange.
      - name: Publish (next dist-tag for dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'test' }}
        run: npm publish --access public --tag next

      - name: Publish (prod)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod') }}
        run: npm publish --access public

      - name: Stage-proof (never public — reject the stage on npmjs.com after)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'stage-proof' }}
        run: |
          npm version "$(node -p "require('./package.json').version")-proof.${{ github.run_number }}" --no-git-tag-version
          npm stage publish --access public
